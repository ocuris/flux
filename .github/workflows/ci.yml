name: Flux Sanity Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Security Scan (govulncheck)
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Build & Race Test
      run: |
        go mod verify
        go build -v ./...
        # Run tests with the race detector enabled
        go test -v -race ./...

    - name: End-to-End Routing & API Tests
      run: |
        # run_examples.sh loops through our example apps and executes curl validation tests.
        bash scripts/run_examples.sh
