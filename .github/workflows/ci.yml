name: Flux Sanity Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Build and Verify Code
      run: |
        go mod verify
        go build -v ./...
        go vet ./...

    - name: End-to-End Routing & API Tests
      run: |
        # RUN_EXAMPLES.sh loops through our example apps and executes curl validation tests against them.
        # This will exit with code 1 if any route returns the wrong status code or if any app panics.
        bash RUN_EXAMPLES.sh
