name: Auto Tag Release

on:
  push:
    branches:
      - main

# Grant explicit permission to this action to push Tags and Releases
permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    # We only want to generate a new tag on PR merges, not on raw commits to main if we can help it,
    # but the action handles this gracefully.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to accurately determine the next semantic version

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false # Do not auto-bump if prefix is docs:, chore:, or missing
          release_branches: main

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        # Ensure we don't try to release if no tag was created
        if: steps.tag_version.outputs.new_tag != ''
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
