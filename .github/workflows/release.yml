name: Auto Tag Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

# Grant explicit permission to this action to push Tags and Releases
permissions:
  contents: write

jobs:
  tag-and-release:
    # Only run this release action if the Pull Request was actually MERGED
    # (closing a PR without merging it will abort the release).
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    # We only want to generate a new tag on PR merges, not on raw commits to main if we can help it, 
    # but the action handles this gracefully.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to accurately determine the next semantic version
          
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Bumps 1.0.0 to 1.0.1 by default
          release_branches: main
          
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
