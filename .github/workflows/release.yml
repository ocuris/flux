name: Release & Brew Update
on:
  push:
    tags:
      - 'v*'

jobs:
  update-brew:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate SHA256
        id: shasum
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          # Download the source archive and calculate hash
          curl -L https://github.com/ocuris/flux/archive/${GITHUB_REF}.tar.gz | sha256sum | awk '{print $1}' > sha.txt
          echo "hash=$(cat sha.txt)" >> $GITHUB_OUTPUT

      - name: Trigger Homebrew Update
        uses: peter-evans/repository-dispatch@v2
        with:
          token: \${{ secrets.HOMEBREW_FLUX_TOKEN }}
          repository: ocuris/homebrew-flux
          event-type: flux-release
          client-payload: |
            {
              "version": "\${{ steps.shasum.outputs.tag }}",
              "sha256": "\${{ steps.shasum.outputs.hash }}"
            }
