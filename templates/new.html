<!doctype html>
<html>
  <head>
    <title>API Documentation</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Prevent caching to ensure fresh spec is loaded -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!-- 
      Scalar generates a stunning API reference from our openapi.json.
      It features a beautiful dark mode, instant search, and code snippets in 20+ languages.
    -->
    <script id="api-reference" data-url="/openapi.json"></script>
    <script>
      var configuration = {
        theme: 'deepSpace',
        searchHotKey: 'k',
        metaData: {
          title: 'Flux API Documentation'
        }
      }
      document.getElementById('api-reference').dataset.configuration = JSON.stringify(configuration)
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
